<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahifa topilmadi — KiberAkademiya</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark light; --bg: #0b0f14; --text: #e6edf3; --muted: #9aa7b4; --accent: #34d399; }
      @media (prefers-color-scheme: light) { :root { --bg: #f7f9fb; --text: #0f172a; --muted: #475569; --accent: #059669; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      h1 { font-size: 4rem; margin: 0; color: var(--accent); }
      p { color: var(--muted); max-width: 420px; }
      a { display: inline-block; margin-top: 12px; padding: 10px 20px; border-radius: 10px; background: var(--accent);
        color: #04140e; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Bunday sahifa yo'q. Havola eskirgan yoki manzil noto'g'ri yozilgan bo'lishi mumkin.</p>
      <a href="/">KiberAkademiya bosh sahifasi</a>
    </main>
  </body>
</html>
